[project]
description = "Utility library."
name = "synodic-template-library"

license = "MIT"

authors = [
  {name = "Synodic Software", email = "contact@synodic.software"},
]

readme = "README.md"

dynamic = ["version"]

dependencies = []
requires-python = ">=3.10"

[project.license-files]
paths = ["LICENSE.md"]

[project.urls]
homepage = "https://github.com/Synodic-Software/Synodic-Template-Library"
repository = "https://github.com/Synodic-Software/Synodic-Template-Library"

[tool.cppython]
dependencies = [
  'gtest',
]

[tool.cppython.provider.vcpkg]

[tool.pdm.dev-dependencies]
dev = [
  "cppython-vcpkg>=0.3.2.dev2",
  "cppython-pdm>=0.2.8.dev2",
  "cppython-cmake>=0.0.0.dev0",
]

[tool.pdm.scripts]
build = {shell = "cmake --preset all"}
test = {shell = "ctest --preset windows-msbuild-msvc-debug"}

[build-system]
build-backend = "pdm.pep517.api"
requires = ["pdm-pep517"]
