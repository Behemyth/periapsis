[[package]]
name = "blinker"
version = "1.4"
summary = "Fast, simple object-to-object and broadcast signaling"

[[package]]
name = "click"
version = "8.1.3"
requires_python = ">=3.7"
summary = "Composable command line interface toolkit"
dependencies = [
    "colorama; platform_system == \"Windows\"",
]

[[package]]
name = "colorama"
version = "0.4.4"
requires_python = ">=2.7, !=3.0.*, !=3.1.*, !=3.2.*, !=3.3.*, !=3.4.*"
summary = "Cross-platform colored terminal text."

[[package]]
name = "cppython"
version = "0.6.1.dev5"
requires_python = ">=3.10"
summary = "A Python package manager agnostic plugin integrating a transparent Conan and CMake workflow."
dependencies = [
    "click>=8.1.3",
    "cppython-core>=0.3.3.dev0",
    "pydantic>=1.9.0",
    "tomlkit>=0.10.2",
]

[[package]]
name = "cppython-core"
version = "0.3.3.dev0"
requires_python = ">=3.10"
summary = "Data definitions for CPPython"
dependencies = [
    "packaging>=21.3",
    "pydantic>=1.9",
]

[[package]]
name = "cppython-pdm"
version = "0.2.8.dev2"
requires_python = ">=3.10"
summary = "Interface plugin for CPPython that hooks into PDM"
dependencies = [
    "cppython>=0.6.1.dev4",
    "pdm>=1.14.1",
]

[[package]]
name = "cppython-vcpkg"
version = "0.3.2.dev2"
requires_python = ">=3.10"
summary = "A plugin for CPPython that enables vcpkg support for CMake projects"
dependencies = [
    "cppython-core>=0.3.3.dev0",
]

[[package]]
name = "findpython"
version = "0.1.5"
requires_python = ">=3.7"
summary = "A utility to find python versions on your system"
dependencies = [
    "packaging>=20",
]

[[package]]
name = "installer"
version = "0.5.1"
requires_python = ">=3.7"
summary = "A library for installing Python wheels."

[[package]]
name = "packaging"
version = "21.3"
requires_python = ">=3.6"
summary = "Core utilities for Python packages"
dependencies = [
    "pyparsing!=3.0.5,>=2.0.2",
]

[[package]]
name = "pdm"
version = "1.14.1"
requires_python = ">=3.7"
summary = "Python Development Master"
dependencies = [
    "blinker",
    "click>=7",
    "findpython",
    "installer<0.6,>=0.5.1",
    "packaging",
    "pdm-pep517<1,>=0.9",
    "pep517>=0.11.0",
    "pip>=20.1",
    "platformdirs",
    "python-dotenv>=0.15",
    "resolvelib<0.9,>=0.8",
    "shellingham>=1.3.2",
    "tomli>=1.1.0",
    "tomlkit<1,>=0.8.0",
    "wheel>=0.36.2",
]

[[package]]
name = "pdm-pep517"
version = "0.12.3"
requires_python = ">=3.7"
summary = "A PEP 517 backend for PDM that supports PEP 621 metadata"

[[package]]
name = "pep517"
version = "0.12.0"
summary = "Wrappers to build Python packages using PEP 517 hooks"
dependencies = [
    "tomli>=1.1.0; python_version >= \"3.6\"",
]

[[package]]
name = "pip"
version = "22.0.4"
requires_python = ">=3.7"
summary = "The PyPA recommended tool for installing Python packages."

[[package]]
name = "platformdirs"
version = "2.5.1"
requires_python = ">=3.7"
summary = "A small Python module for determining appropriate platform-specific dirs, e.g. a \"user data dir\"."

[[package]]
name = "pydantic"
version = "1.9.0"
requires_python = ">=3.6.1"
summary = "Data validation and settings management using python 3.6 type hinting"
dependencies = [
    "typing-extensions>=3.7.4.3",
]

[[package]]
name = "pyparsing"
version = "3.0.8"
requires_python = ">=3.6.8"
summary = "pyparsing module - Classes and methods to define and execute parsing grammars"

[[package]]
name = "python-dotenv"
version = "0.20.0"
requires_python = ">=3.5"
summary = "Read key-value pairs from a .env file and set them as environment variables"

[[package]]
name = "resolvelib"
version = "0.8.1"
summary = "Resolve abstract dependencies into concrete ones"

[[package]]
name = "shellingham"
version = "1.4.0"
requires_python = "!=3.0,!=3.1,!=3.2,!=3.3,>=2.6"
summary = "Tool to Detect Surrounding Shell"

[[package]]
name = "tomli"
version = "2.0.1"
requires_python = ">=3.7"
summary = "A lil' TOML parser"

[[package]]
name = "tomlkit"
version = "0.10.2"
requires_python = ">=3.6,<4.0"
summary = "Style preserving TOML library"

[[package]]
name = "typing-extensions"
version = "4.1.1"
requires_python = ">=3.6"
summary = "Backported and Experimental Type Hints for Python 3.6+"

[[package]]
name = "wheel"
version = "0.37.1"
requires_python = "!=3.0.*,!=3.1.*,!=3.2.*,!=3.3.*,!=3.4.*,>=2.7"
summary = "A built-package format for Python"

