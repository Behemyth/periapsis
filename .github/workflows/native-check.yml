name: Check Native Status
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: native-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    uses: synodic/.github/.github/workflows/native-check.yml@v1.0.0
    with:
      fast-install: pdm install -G native
      fast-uses-cmake: true
      fast-command: pdm lock --check && "$CMAKE_BINARY" --list-presets=all
      native-lanes: >-
        [
          {"name":"windows-x64-msvc","runner":"windows-2025-vs2026","toolchain":"msvc","install":"pdm install -G native","command":"pdm run cppython install; pdm run cppython configure --configuration windows-ninja-msvc; for c in debug release; do pdm run cppython build --configuration windows-ninja-msvc-$c; pdm run cppython test --configuration windows-ninja-msvc-$c; done"},
          {"name":"windows-arm64-msvc","runner":"windows-11-vs2026-arm","toolchain":"msvc","install":"pdm install -G native","command":"pdm run cppython install; pdm run cppython configure --configuration windows-ninja-msvc; for c in debug release; do pdm run cppython build --configuration windows-ninja-msvc-$c; pdm run cppython test --configuration windows-ninja-msvc-$c; done"},
          {"name":"ubuntu-x64-llvm-libcxx","runner":"ubuntu-26.04","toolchain":"llvm-libcxx","install":"pdm install -G native","command":"pdm run cppython install; pdm run cppython configure --configuration linux-ninja-clang-libcxx; for c in debug release; do pdm run cppython build --configuration linux-ninja-clang-libcxx-$c; pdm run cppython test --configuration linux-ninja-clang-libcxx-$c; done"},
          {"name":"ubuntu-arm64-llvm-libcxx","runner":"ubuntu-26.04-arm","toolchain":"llvm-libcxx","install":"pdm install -G native","command":"pdm run cppython install; pdm run cppython configure --configuration linux-ninja-clang-libcxx; for c in debug release; do pdm run cppython build --configuration linux-ninja-clang-libcxx-$c; pdm run cppython test --configuration linux-ninja-clang-libcxx-$c; done"},
          {"name":"macos-arm64-llvm-libcxx","runner":"macos-26","toolchain":"llvm-libcxx","install":"pdm install -G native","command":"pdm run cppython install; pdm run cppython configure --configuration macos-ninja-llvm-libcxx; for c in debug release; do pdm run cppython build --configuration macos-ninja-llvm-libcxx-$c; pdm run cppython test --configuration macos-ninja-llvm-libcxx-$c; done"},
          {"name":"ubuntu-x64-llvm-libcxx-sanitize","runner":"ubuntu-26.04","toolchain":"llvm-libcxx","install":"pdm install -G native","command":"pdm run cppython install; pdm run cppython configure --configuration linux-ninja-clang-libcxx-sanitize; for c in debug; do pdm run cppython build --configuration linux-ninja-clang-libcxx-sanitize-$c; pdm run cppython test --configuration linux-ninja-clang-libcxx-sanitize-$c; done"}
        ]
