name: Check Native Status
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:
    inputs:
      identity:
        description: Native identity to test
        type: choice
        required: true
        options:
          - windows-x64-msvc
          - windows-arm64-msvc
          - linux-x64-clang-libcxx
          - linux-arm64-clang-libcxx
          - linux-x64-clang-libcxx-sanitize
          - macos-arm64-clang-libcxx

permissions:
  contents: read

concurrency:
  group: native-check-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}${{ inputs.identity && format('-{0}', inputs.identity) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name != 'workflow_dispatch'
    uses: Behemyth/.github/.github/workflows/native-check.yml@e81836fb615107e90135e64069d3471566673a9a
    with:
      fast-install: pdm install -G native
      fast-uses-cmake: true
      fast-command: pdm lock --check && "$CMAKE_BINARY" --list-presets=all
      native-install: pdm install -G native
      configuration-ref: &configuration-ref 38c8d01da33b80face10ac873f29156a50365cbf
      native-identities: &identities >-
        ["windows-x64-msvc", "windows-arm64-msvc", "linux-x64-clang-libcxx",
         "linux-arm64-clang-libcxx", "linux-x64-clang-libcxx-sanitize",
         "macos-arm64-clang-libcxx"]

  development-check:
    if: github.event_name == 'workflow_dispatch'
    uses: Behemyth/.github/.github/workflows/native-check.yml@e81836fb615107e90135e64069d3471566673a9a
    with:
      fast-install: pdm install -G native
      fast-uses-cmake: true
      fast-command: pdm lock --check && "$CMAKE_BINARY" --list-presets=all
      native-install: pdm install -G native
      configuration-ref: *configuration-ref
      native-identities: *identities
      targeted: true
      target-identity: ${{ inputs.identity }}
